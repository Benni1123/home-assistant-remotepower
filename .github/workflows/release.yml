name: Release

on:
  push:
    branches: [main]
    paths:
      - "custom_components/**"
      - "scripts/release.py"
      - ".github/workflows/release.yml"
      - "hacs.json"
  workflow_dispatch:
    inputs:
      use_latest_pr:
        description: "Letzten gemergten PR als Changelog verwenden"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: remotepower-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Release only validated main, never the contents of a selected feature branch.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install validation dependencies
        run: python -m pip install homeassistant==2025.3.4 voluptuous ruff
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q custom_components scripts
      - run: ruff check custom_components tests scripts
      - name: Smoke-test real HA APIs with a fake host
        run: python -m scripts.ha_smoke
      - name: Build and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          USE_LATEST_PR: ${{ inputs.use_latest_pr || false }}
        run: python -m scripts.release
